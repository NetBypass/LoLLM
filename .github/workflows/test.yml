name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Nol dependensi: cukup node --test, upstream di-mock lokal.
      - name: Unit + fungsional
        run: npm test

  dashboard:
    name: Dashboard (build + audit + SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Audit identifier + smoke test SSR
        working-directory: web
        run: npm test
      - name: Build harus bersih (public/ di-commit)
        working-directory: web
        run: npm run build
      - name: Pastikan hasil build sudah di-commit
        run: |
          if ! git diff --quiet --exit-code public/ ; then
            echo "::error file=public/index.html::public/ tidak sama dengan hasil build web/src. Jalankan: npm run build:web"
            git diff --stat public/
            exit 1
          fi
