<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoLLM Gateway</title>
<style>
:root{
  --bg:#0b0f17;--panel:#121826;--panel2:#0d1320;--border:#1f2937;--border2:#2a3650;
  --text:#e7ecf5;--muted:#8b98ad;--accent:#7c5cff;--accent2:#00d4ff;
  --ok:#34d399;--warn:#fbbf24;--err:#f87171;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(11,15,23,.93);backdrop-filter:blur(10px);z-index:20;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:9px;font-weight:800;font-size:17px;letter-spacing:.2px}
.logo .bolt{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{color:var(--muted);font-weight:500;font-size:12px}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:3px 10px;border-radius:99px;display:flex;align-items:center;gap:6px}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:7px 14px;border-radius:9px;cursor:pointer;font-size:13.5px}
nav button:hover{color:var(--text)}
nav button.active{color:var(--text);background:var(--panel);border-color:var(--border)}
main{max-width:1200px;margin:0 auto;padding:24px 22px 70px}
h2{font-size:15px;margin-bottom:14px;color:var(--text)}
h2 small{color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.stat .v{font-size:26px;font-weight:800;font-family:var(--mono)}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.stat .sub{font-size:11px;color:var(--muted)}
.section{margin-top:26px}
.badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;letter-spacing:.4px;text-transform:uppercase}
.b-free{background:rgba(52,211,153,.14);color:var(--ok)}
.b-freemium{background:rgba(251,191,36,.14);color:var(--warn)}
.b-paid{background:rgba(248,113,113,.13);color:var(--err)}
.b-custom{background:rgba(124,92,255,.15);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px}
tr:last-child td{border-bottom:none}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.pcard .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pcard .name{font-weight:700;font-size:15px}
.pcard .note{color:var(--muted);font-size:12.5px;margin-top:5px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-family:var(--mono);font-size:11px;color:var(--accent2);background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.18);padding:2px 8px;border-radius:6px}
.klist{margin-top:12px}
.krow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;margin-bottom:7px;flex-wrap:wrap}
.kdot{width:8px;height:8px;border-radius:50%;flex:none}
.kdot.ok{background:var(--ok);box-shadow:0 0 7px var(--ok)}
.kdot.cooling{background:var(--warn)}
.kdot.dead{background:var(--err)}
.kdot.disabled{background:var(--muted)}
.krow .label{font-weight:600}
.krow .val{font-family:var(--mono);font-size:11.5px;color:var(--muted);cursor:pointer;user-select:none}
.krow .meta{font-size:11px;color:var(--muted)}
.krow .actions{margin-left:auto;display:flex;gap:6px}
.btn{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#5a3df0);border:none;font-weight:600}
.btn.danger{color:var(--err)}
.btn.sm{padding:3px 9px;font-size:11.5px}
.addform{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addform input{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:9px;font-family:var(--mono);font-size:12.5px}
.addform input::placeholder{color:#52607a}
.addform input.short{flex:0 0 130px;font-family:inherit}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:9px;font-family:var(--mono);font-size:13px;width:100%}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex:none}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--border2);border-radius:99px;cursor:pointer;transition:.18s}
.slider:before{content:"";position:absolute;height:15px;width:15px;left:3px;top:3px;background:#cbd5e1;border-radius:50%;transition:.18s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(17px);background:#fff}
.rad{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rad label{display:block;background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer}
.rad input{margin-right:8px;accent-color:var(--accent)}
.rad b{font-size:13.5px}
.rad small{display:block;color:var(--muted);margin-top:3px;font-size:11.5px}
pre.code{background:#070b12;border:1px solid var(--border);border-radius:11px;padding:13px 15px;font-family:var(--mono);font-size:12px;overflow-x:auto;color:#a8ffd9;position:relative}
.copy{position:absolute;top:8px;right:8px}
.toast{position:fixed;bottom:20px;right:20px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--panel);border:1px solid var(--border2);border-left:3px solid var(--accent2);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:tin .2s ease}
.toast div.err{border-left-color:var(--err)}
.toast div.okk{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.hbar{display:flex;gap:6px;align-items:center}
.hdot{width:9px;height:9px;border-radius:50%}
.hdot.up{background:var(--ok);box-shadow:0 0 8px rgba(52,211,153,.7)}
.hdot.cooling{background:var(--warn)}
.hdot.down,.hdot.off{background:var(--err)}
.hdot.empty{background:var(--border2)}
.tnum{font-family:var(--mono);font-size:12px}
.trailchip{display:inline-block;font-family:var(--mono);font-size:10.5px;padding:1px 7px;border-radius:5px;margin:1px;background:rgba(248,113,113,.1);color:#fca5a5;border:1px solid rgba(248,113,113,.2)}
.trailchip.win{background:rgba(52,211,153,.1);color:var(--ok);border-color:rgba(52,211,153,.25)}
.gwkey{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gwkey code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--border2);padding:7px 12px;border-radius:8px;user-select:all}
.empty{color:var(--muted);font-size:13px;padding:18px;text-align:center;border:1px dashed var(--border2);border-radius:11px}
.orow{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;margin-bottom:6px}
.orow .pos{color:var(--muted);font-family:var(--mono);font-size:11px;width:20px}
.orow button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}
.orow button:hover{color:var(--text)}
@media(max-width:720px){header{padding:10px 14px}main{padding:16px 14px 60px}}
</style>
</head>
<body>
<header>
  <div class="logo"><span class="bolt">⚡</span>LoLLM <span class="ver">v__LOLLM_VERSION__</span></div>
  <span class="pill"><span class="dot"></span><span id="uptime">memulai…</span></span>
  <nav>
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="providers">Providers &amp; Keys</button>
    <button data-tab="routing">Routing</button>
    <button data-tab="logs">Logs</button>
  </nav>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";
const SESSION = "__LOLLM_SESSION__";
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => [...(el || document).querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const S = { tab: "overview", boot: null, status: null, logs: [], reveal: new Set(), order: null, logsOn: true, models: null, play: { messages: [], model: "auto", system: "", busy: false } };

async function api(path, opts = {}) {
  const o = { method: opts.method || "GET", headers: { "x-lollm-session": SESSION, "Content-Type": "application/json" } };
  if (opts.body) o.body = JSON.stringify(opts.body);
  const r = await fetch("/api/" + path, o);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j?.error?.message || j?.error || "HTTP " + r.status);
  return j;
}

function toast(msg, kind = "") {
  const d = document.createElement("div");
  d.className = kind;
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

function fmtUptime(s) {
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
}
const fmtMs = (ms) => (ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : Math.round(ms) + "ms");

function copy(text, btn) {
  navigator.clipboard.writeText(text).then(
    () => { toast("Disalin ke clipboard", "okk"); if (btn) { const t = btn.textContent; btn.textContent = "✓"; setTimeout(() => (btn.textContent = t), 900); } },
    () => toast("Gagal menyalin", "err")
  );
}

// ---------------- RENDER: OVERVIEW ----------------
function renderOverview() {
  const st = S.status, stats = st?.stats || {};
  const okRate = stats.requests ? Math.round((stats.ok / stats.requests) * 100) : 100;
  const avg = stats.ok ? Math.round(stats.totalMs / stats.ok) : 0;
  const health = st?.health || [];
  const activeKeys = health.reduce((a, p) => a + (p.keys?.ok || 0), 0);
  const gwKey = (S.boot?.gatewayKeys || [])[0] || "-";
  const port = location.port || "5151";

  const cards = [
    ["Requests", stats.requests ?? 0, (stats.ok ?? 0) + " sukses · " + (stats.fail ?? 0) + " gagal"],
    ["Sukses", okRate + "%", "fallback tak terasa ✨"],
    ["Latensi rata²", fmtMs(avg), "first hit per request"],
    ["Perpindahan fallback", stats.fallbacks ?? 0, "lintas key & provider"],
    ["Token", (stats.tokensIn ?? 0).toLocaleString("id") + " → " + (stats.tokensOut ?? 0).toLocaleString("id"), "masuk → keluar"],
    ["Key sehat", activeKeys, health.filter((p) => p.state === "up").length + " provider aktif"],
  ];

  const healthRows = health.length
    ? health.map((p) => {
        const cls = p.state === "up" ? "up" : p.state === "cooling" ? "cooling" : p.state === "off" ? "off" : p.state === "empty" ? "empty" : "down";
        const k = p.keys || { ok: 0, cooling: 0, dead: 0, disabled: 0 };
        return `<tr>
          <td><b>${esc(p.name)}</b> <span class="muted mono">${esc(p.id)}</span></td>
          <td><span class="badge b-${esc(p.tier)}">${esc(p.tier)}</span></td>
          <td><span class="hbar"><span class="hdot ${cls}"></span>${p.state}</span></td>
          <td class="tnum">✓${k.ok} ⏳${k.cooling} ✕${k.dead}${k.disabled ? " ⊘" + k.disabled : ""}</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="4"><div class="empty">Belum ada provider dengan key. Buka tab <b>Providers &amp; Keys</b> dan tempel API key gratis.</div></td></tr>`;

  $("#view").innerHTML = `
    <div class="grid g5">
      ${cards.map((c) => `<div class="card stat"><div class="v">${esc(c[1])}</div><div class="l">${esc(c[0])}</div><div class="sub">${esc(c[2])}</div></div>`).join("")}
    </div>

    <div class="section">
      <h2>Kesehatan provider</h2>
      <div class="card" style="padding:4px 14px">
        <table>
          <thead><tr><th>Provider</th><th>Tier</th><th>Status</th><th>Key pool</th></tr></thead>
          <tbody>${healthRows}</tbody>
        </table>
      </div>
    </div>

    <div class="section">
      <h2>Quickstart <small>— pakai seperti OpenAI SDK</small></h2>
      <div class="card">
        <div class="gwkey" style="margin-bottom:12px">
          <span class="muted">Gateway key:</span>
          <code id="gwkey">${esc(gwKey)}</code>
          <button class="btn sm" onclick="copy($('#gwkey').textContent,this)">📋 Salin</button>
        </div>
        <pre class="code" id="qs1">export OPENAI_BASE_URL=http://localhost:${port}/v1
export OPENAI_API_KEY=${esc(gwKey)}

# atau langsung:
curl http://localhost:${port}/v1/chat/completions \\
  -H "Authorization: Bearer ${esc(gwKey)}" \\
  -H "Content-Type: application/json" \\
  -d '{"model":"auto","messages":[{"role":"user","content":"halo dewa!"}]}'<button class="btn sm copy" onclick="copy($('#qs1').textContent.replace('📋',''),this)">📋</button></pre>
        <p class="muted" style="margin-top:10px;font-size:12.5px">
          Model <code class="mono">auto</code> memilih provider sehat terbaik · <code class="mono">groq/llama-3.3-70b-versatile</code> mem-pin provider ·
          header response <code class="mono">x-lollm-trail</code> menampilkan jejak fallback.
        </p>
      </div>
    </div>`;
}

// ---------------- RENDER: PROVIDERS ----------------
function tierLabel(t) { return { free: "Gratis", freemium: "Freemium", paid: "Berbayar", custom: "Custom" }[t] || t; }

function renderProviders() {
  const boot = S.boot;
  const groups = { free: [], freemium: [], paid: [], custom: [] };
  for (const p of [...boot.catalog, ...boot.customProviders]) (groups[p.tier] || (groups[p.tier] = [])).push(p);

  const section = (tier, title, desc) => {
    const list = groups[tier] || [];
    if (!list.length) return "";
    return `<div class="section"><h2>${title} <small>— ${desc}</small></h2>${list.map(providerCard).join("")}</div>`;
  };

  $("#view").innerHTML =
    section("free", "🆓 Provider gratis", "tempel API key, langsung jalan — tanpa setup apa pun") +
    section("freemium", "🟡 Freemium", "kredit trial / kuota terbatas") +
    section("paid", "💸 Berbayar", "provider utama (opsional)") +
    section("custom", "🛠 Custom", "provider OpenAI-compatible milikmu sendiri") +
    `<div class="section"><h2>Tambah provider custom</h2><div class="card">
      <div class="addform">
        <input id="cp-name" placeholder="Nama, mis. OpenRouter-Lama" style="flex:1;min-width:150px">
        <input id="cp-url" placeholder="https://base-url/v1" style="flex:2;min-width:220px">
        <select id="cp-style" style="flex:0 0 130px"><option value="openai">OpenAI style</option><option value="anthropic">Anthropic</option></select>
        <button class="btn primary" onclick="addCustom()">＋ Tambah</button>
      </div>
      <p class="muted" style="margin-top:8px;font-size:12px">Setelah dibuat, tempel key-nya di kartu provider custom di atas.</p>
    </div></div>`;
}

function providerCard(p) {
  const conf = S.boot.providers[p.id] || { enabled: true, keys: [] };
  const keys = conf.keys || [];
  const models = (p.models || []).slice(0, 5);
  const more = (p.models || []).length - models.length;

  const keyRows = keys.length
    ? keys.map((k) => {
        const rid = p.id + "/" + k.id;
        const shown = S.reveal.has(rid);
        const masked = k.id === "keyless" ? "tanpa key" : shown ? k.value : (k.value || "").slice(0, 6) + "…" + (k.value || "").slice(-4);
        const state = k.status === "dead" ? "dead" : k.cooldownUntil > Date.now() ? "cooling" : k.enabled === false ? "disabled" : "ok";
        return `<div class="krow">
          <span class="kdot ${state}" title="${state}"></span>
          <span class="label">${esc(k.label)}</span>
          <span class="val" onclick="toggleReveal('${rid}')">${esc(masked)}</span>
          <span class="meta">✓${k.success || 0} ✕${k.fail || 0}${k.lastError ? ' · <span title="' + esc(k.lastError) + '">⚠</span>' : ""}</span>
          <span class="actions">
            <button class="btn sm" onclick="testKey('${p.id}','${k.id}',this)">Test</button>
            <button class="btn sm" onclick="toggleKey('${p.id}','${k.id}',${k.enabled !== false})">${k.enabled !== false ? "Nonaktif" : "Aktifkan"}</button>
            <button class="btn sm danger" onclick="delKey('${p.id}','${k.id}')">Hapus</button>
          </span>
        </div>`;
      }).join("")
    : `<div class="empty" style="padding:12px">Belum ada key di pool${p.keyless ? " — provider ini tidak butuh key." : "."}</div>`;

  return `<div class="pcard" id="pc-${esc(p.id)}">
    <div class="head">
      <span class="name">${esc(p.name)}</span>
      <span class="badge b-${esc(p.tier)}">${tierLabel(p.tier)}</span>
      ${p.keyless ? '<span class="badge b-free">keyless</span>' : ""}
      <span class="mono muted" style="font-size:11px">${esc(p.baseUrl)}</span>
      <span style="margin-left:auto;display:flex;gap:10px;align-items:center">
        ${p.getKey ? `<a href="${esc(p.getKey)}" target="_blank" rel="noopener" class="btn sm">🔑 ${p.tier === "free" ? "Ambil key gratis" : "Ambil key"} ↗</a>` : ""}
        <label class="switch" title="Aktif/nonaktif provider">
          <input type="checkbox" ${conf.enabled !== false ? "checked" : ""} onchange="toggleProvider('${p.id}',this.checked)">
          <span class="slider"></span>
        </label>
      </span>
    </div>
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ""}
    <div class="chips">${models.map((m) => `<span class="chip">${esc(m)}</span>`).join("")}${more > 0 ? `<span class="chip" style="color:var(--muted)">+${more} lagi</span>` : ""}</div>
    <div class="klist">${keyRows}</div>
    ${p.keyless ? "" : `<div class="addform">
      <input id="addk-${esc(p.id)}" placeholder="Tempel ${esc(p.name)} API key di sini…">
      <input id="addl-${esc(p.id)}" class="short" placeholder="label (opsional)">
      <button class="btn primary" onclick="addKey('${p.id}')">＋ Masukkan ke pool</button>
    </div>`}
  </div>`;
}

// ---------------- RENDER: ROUTING ----------------
function renderRouting() {
  const s = S.boot.settings;
  const t = s.timeouts;
  const health = S.status?.health || [];
  const orderIds = S.order || s.providerOrder?.length
    ? [...(S.order || s.providerOrder)]
    : [];
  const known = [...new Set([...(S.order || s.providerOrder || []), ...health.map((h) => h.id)])];
  const items = known.map((id, i) => {
    const h = health.find((x) => x.id === id);
    return `<div class="orow">
      <span class="pos">${i + 1}.</span>
      <b>${esc(h?.name || id)}</b><span class="muted mono" style="font-size:11px">${esc(id)}</span>
      <span style="margin-left:auto">
        <button title="naik" onclick="moveOrder('${id}',-1)">▲</button>
        <button title="turun" onclick="moveOrder('${id}',1)">▼</button>
      </span>
    </div>`;
  }).join("");

  $("#view").innerHTML = `
    <div class="section" style="margin-top:0">
      <h2>Strategi routing</h2>
      <div class="rad" id="strategy">
        <label><input type="radio" name="st" value="failover" ${s.strategy === "failover" ? "checked" : ""}><b>Failover</b><small>Urutan prioritas; key &amp; provider berikutnya dicoba instan saat gagal.</small></label>
        <label><input type="radio" name="st" value="round-robin" ${s.strategy === "round-robin" ? "checked" : ""}><b>Round-robin</b><small>Sebar beban merata ke semua kandidat sehat.</small></label>
        <label><input type="radio" name="st" value="free-first" ${s.strategy === "free-first" ? "checked" : ""}><b>Free-first</b><small>Provider gratis didahulukan, berbayar hanya cadangan.</small></label>
      </div>
    </div>

    <div class="section"><h2>Timeout <small>— inilah rahasia fallback secepat kilat</small></h2>
      <div class="card">
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
          <label class="f"><span>Connect (fetch → headers)</span><input type="number" id="t-connectMs" value="${t.connectMs}"></label>
          <label class="f"><span>First byte (stream)</span><input type="number" id="t-firstByteMs" value="${t.firstByteMs}"></label>
          <label class="f"><span>Total (non-stream)</span><input type="number" id="t-totalMs" value="${t.totalMs}"></label>
          <label class="f"><span>Stream idle</span><input type="number" id="t-streamIdleMs" value="${t.streamIdleMs}"></label>
        </div>
        <p class="muted" style="font-size:12px">Semua dalam milidetik. Makar pendek → fallback makin cepat; terlalu pendek → request lambat terpotong.</p>
      </div>
    </div>

    <div class="section"><h2>Umum</h2>
      <div class="card">
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">
          <label class="f"><span>Maks percobaan per request</span><input type="number" id="s-maxAttempts" value="${s.maxAttempts}" min="1" max="12"></label>
          <label class="f"><span>Autentikasi gateway key wajib</span><label class="switch"><input type="checkbox" id="s-authRequired" ${s.authRequired ? "checked" : ""}><span class="slider"></span></label></label>
          <label class="f"><span>Last-resort: pakai provider sehat mana pun jika model asli habis</span><label class="switch"><input type="checkbox" id="s-allowAnyFallback" ${s.allowAnyFallback ? "checked" : ""}><span class="slider"></span></label></label>
        </div>
      </div>
    </div>

    <div class="section"><h2>Urutan prioritas provider <small>— kosong = pakai prioritas katalog</small></h2>
      <div class="card">${items || '<div class="empty">Tambahkan key dulu di tab Providers, lalu atur urutan di sini.</div>'}</div>
    </div>

    <div class="section" style="display:flex;gap:10px">
      <button class="btn primary" style="padding:10px 22px" onclick="saveSettings()">💾 Simpan pengaturan</button>
      <button class="btn" style="padding:10px 16px" onclick="S.order=null;refresh();toast('Urutan direset')">↺ Reset urutan</button>
    </div>

    <div class="section"><h2>Gateway API key</h2>
      <div class="card">
        <div class="gwkey">
          <code id="gwkey2">${esc((S.boot.gatewayKeys || [])[0] || "-")}</code>
          <button class="btn sm" onclick="copy($('#gwkey2').textContent,this)">📋 Salin</button>
          <button class="btn sm danger" onclick="rotateKey()">⟳ Rotate</button>
        </div>
        <p class="muted" style="margin-top:8px;font-size:12px">Key ini dipakai client sebagai <code class="mono">Authorization: Bearer …</code> menuju <code class="mono">/v1</code>. Rotate akan membatalkan key lama.</p>
      </div>
    </div>`;
}

// ---------------- RENDER: LOGS ----------------
function renderLogs() {
  const logs = S.logs || [];
  const rows = logs.length
    ? logs.map((l) => {
        const trail = (l.trail || []).map((t) => `<span class="trailchip">${esc(t.provider)}/${esc(t.key)}:${esc(t.kind)}</span>`).join(" ");
        const win = l.status === 200 ? `<span class="trailchip win">${esc(l.provider || "")}${l.key ? "/" + esc(l.key) : ""} ✓</span>` : "";
        return `<tr>
          <td class="mono muted" style="white-space:nowrap">${new Date(l.ts).toLocaleTimeString("id")}</td>
          <td class="mono">${esc(l.model)}${l.finalModel && l.finalModel !== l.model ? ' <span class="muted">→</span> ' + esc(l.finalModel) : ""}</td>
          <td>${l.stream ? "sse" : "json"}</td>
          <td style="color:${l.status === 200 ? "var(--ok)" : l.status === "aborted" ? "var(--muted)" : "var(--err)"}">${esc(l.status)}</td>
          <td class="tnum">${fmtMs(l.ms || 0)}</td>
          <td class="tnum">${esc(l.usage || "")}</td>
          <td style="min-width:160px">${win}${trail}</td>
        </tr>`;
      }).join("")
    : `<tr><td colspan="7"><div class="empty">Belum ada request lewat gateway. Coba quickstart di tab Overview. 🚀</div></td></tr>`;

  $("#view").innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <h2 style="margin:0">Log request <small>(terbaru dulu, maks 500)</small></h2>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <label class="switch" title="auto-refresh"><input type="checkbox" id="logs-on" ${S.logsOn ? "checked" : ""} onchange="S.logsOn=this.checked"><span class="slider"></span></label>
        <span class="muted" style="font-size:12px">auto-refresh</span>
        <button class="btn sm" onclick="loadLogs(true)">↻</button>
        <button class="btn sm danger" onclick="clearLogs()">Bersihkan</button>
      </span>
    </div>
    <div class="card" style="padding:4px 14px;overflow-x:auto">
      <table>
        <thead><tr><th>Waktu</th><th>Model</th><th>Tipe</th><th>Status</th><th>Durasi</th><th>Token</th><th>Jejak fallback</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ---------------- RENDER: PLAYGROUND ----------------
async function loadPlayModels() {
  try {
    const r = await api("models");
    S.models = r.models || [];
    if (S.tab === "playground") renderPlayground();
  } catch {}
}

function renderPlayground() {
  const opts = [...new Set((S.models || []).map((m) => m.id))].slice(0, 400);
  $("#view").innerHTML = `
    <div class="pg">
      <div class="pg-side">
        <div class="card">
          <label class="f"><span>Model</span>
            <input type="text" id="pg-model" list="dl-models" value="${esc(S.play.model)}" placeholder="auto">
            <datalist id="dl-models">${opts.map((m) => `<option value="${esc(m)}">`).join("")}</datalist>
          </label>
          <label class="f"><span>System prompt (opsional)</span>
            <textarea id="pg-system" rows="4" placeholder="Kamu asisten yang membantu…">${esc(S.play.system || "")}</textarea>
          </label>
          <button class="btn" style="width:100%" onclick="pgReset()">✨ Chat baru</button>
          <p class="muted" style="font-size:11.5px;margin-top:12px;line-height:1.7">
            <b>auto</b> = provider sehat terbaik · <b>provider/model</b> = pin provider.<br>
            Jejak fallback tampil di bawah chat setelah tiap jawaban. ⚡
          </p>
        </div>
      </div>
      <div class="pg-side">
        <div class="card pg-chat">
          <div class="pg-msgs" id="pg-msgs">${
            S.play.messages.length
              ? S.play.messages.map((m) => `<div class="pg-msg ${m.role === "user" ? "user" : "assistant"}">${esc(m.content)}</div>`).join("")
              : `<div class="empty">Kirim pesan pertamamu — saksikan fallback bekerja live. ⚡</div>`
          }</div>
          <div class="pg-input">
            <textarea id="pg-input" placeholder="Tulis pesan… (Enter = kirim, Shift+Enter = baris baru)"></textarea>
            <button class="btn primary" id="pg-send" onclick="sendChat()">Kirim ➤</button>
          </div>
          <div class="pg-status" id="pg-status"></div>
        </div>
      </div>
    </div>`;
  const inp = $("#pg-input");
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  inp.focus();
}

function pgAppend(role, text) {
  const msgs = $("#pg-msgs");
  const empty = msgs.querySelector(".empty");
  if (empty) empty.remove();
  const d = document.createElement("div");
  d.className = "pg-msg " + (role === "user" ? "user" : "assistant");
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function decodeTrail(b64) {
  try {
    const s = atob(String(b64).replace(/-/g, "+").replace(/_/g, "/"));
    return JSON.parse(s).join("  →  ");
  } catch { return ""; }
}

window.pgReset = () => {
  S.play.messages = [];
  S.play.system = "";
  renderPlayground();
};

window.sendChat = async () => {
  if (S.play.busy) return;
  const text = $("#pg-input").value.trim();
  if (!text) return;
  S.play.model = $("#pg-model").value.trim() || "auto";
  const system = $("#pg-system").value.trim();
  if (system) {
    S.play.messages = [{ role: "system", content: system }, ...S.play.messages.filter((m) => m.role !== "system")];
    S.play.system = system;
  } else {
    S.play.messages = S.play.messages.filter((m) => m.role !== "system");
    S.play.system = "";
  }
  S.play.messages.push({ role: "user", content: text });
  $("#pg-input").value = "";
  pgAppend("user", text);
  const out = pgAppend("assistant", "…");
  S.play.busy = true;
  $("#pg-send").disabled = true;
  $("#pg-status").textContent = "⚡ mengirim…";
  const t0 = performance.now();
  try {
    const res = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-lollm-session": SESSION },
      body: JSON.stringify({ model: S.play.model, stream: true, messages: S.play.messages }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j?.error?.message || "HTTP " + res.status);
    }
    const prov = res.headers.get("x-lollm-provider") || "?";
    const mdl = res.headers.get("x-lollm-model") || S.play.model;
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", full = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          const d = j.choices?.[0]?.delta?.content;
          if (d) { full += d; out.textContent = full; $("#pg-msgs").scrollTop = 1e9; }
        } catch {}
      }
    }
    if (!full) full = "(kosong)";
    S.play.messages.push({ role: "assistant", content: full });
    const ms = Math.round(performance.now() - t0);
    const trail = decodeTrail(res.headers.get("x-lollm-trail"));
    $("#pg-status").innerHTML = `✅ <b>${esc(prov)}</b> · ${esc(mdl)} · ${ms}ms${trail ? ` · fallback: <span class="mono" style="color:var(--warn)">${esc(trail)}</span>` : " · first hit 🎯"}`;
  } catch (e) {
    out.textContent = "✕ " + e.message;
    out.style.border = "1px solid rgba(248,113,113,.4)";
    $("#pg-status").textContent = "";
  } finally {
    S.play.busy = false;
    const btn = $("#pg-send");
    if (btn) btn.disabled = false;
  }
};

// ---------------- ACTIONS ----------------
window.toggleReveal = (rid) => { S.reveal.has(rid) ? S.reveal.delete(rid) : S.reveal.add(rid); renderProviders(); };

window.addKey = async (pid) => {
  const v = $("#addk-" + CSS.escape(pid)).value.trim();
  const l = $("#addl-" + CSS.escape(pid)).value.trim();
  if (!v) return toast("Key-nya kosong dulu, dewa 🙏", "err");
  try {
    await api("keys", { method: "POST", body: { providerId: pid, key: v, label: l } });
    toast("Key masuk pool ✓", "okk");
    await reload();
  } catch (e) { toast(e.message, "err"); }
};

window.toggleBulk = (pid) => {
  const el = $("#bulk-" + CSS.escape(pid));
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
};

window.bulkAdd = async (pid) => {
  const ta = $("#bulkt-" + CSS.escape(pid));
  const keys = ta.value.split(/[\n,;]+/).map((s) => s.trim()).filter(Boolean);
  if (!keys.length) return toast("Tidak ada key yang terbaca", "err");
  try {
    const r = await api("keys", { method: "POST", body: { providerId: pid, keys } });
    toast(`${r.added} key masuk pool${r.skipped ? " · " + r.skipped + " dilewati" : ""} ✓`, "okk");
    ta.value = "";
    await reload();
  } catch (e) { toast(e.message, "err"); }
};

window.delKey = async (pid, kid) => {
  try { await api("keys", { method: "DELETE", body: { providerId: pid, keyId: kid } }); toast("Key dihapus"); await reload(); }
  catch (e) { toast(e.message, "err"); }
};

window.testKey = async (pid, kid, btn) => {
  const old = btn.textContent; btn.textContent = "…";
  try {
    const r = await api("keys/test", { method: "POST", body: { providerId: pid, keyId: kid } });
    if (r.ok) toast(`Key sehat ✓ ${r.ms}ms${r.modelsCount != null ? " · " + r.modelsCount + " model" : ""}`, "okk");
    else toast(`Key bermasalah: ${r.error} (${r.kind})`, "err");
    await reload();
  } catch (e) { toast(e.message, "err"); btn.textContent = old; }
};

window.toggleKey = async (pid, kid, enabled) => {
  try { await api("keys/toggle", { method: "POST", body: { providerId: pid, keyId: kid, enabled: !enabled } }); await reload(); }
  catch (e) { toast(e.message, "err"); }
};

window.toggleProvider = async (pid, enabled) => {
  try { await api("providers/toggle", { method: "POST", body: { providerId: pid, enabled } }); await reload(); }
  catch (e) { toast(e.message, "err"); }
};

window.addCustom = async () => {
  const name = $("#cp-name").value.trim(), baseUrl = $("#cp-url").value.trim(), style = $("#cp-style").value;
  if (!name || !baseUrl) return toast("Nama & base URL wajib", "err");
  try {
    await api("providers/custom", { method: "POST", body: { name, baseUrl, style } });
    toast("Provider custom dibuat ✓", "okk");
    await reload();
  } catch (e) { toast(e.message, "err"); }
};

window.moveOrder = (id, dir) => {
  const cur = S.order || [...(S.boot.settings.providerOrder || [])];
  const known = [...new Set([...cur, ...(S.status?.health || []).map((h) => h.id)])];
  const i = known.indexOf(id), j = i + dir;
  if (j < 0 || j >= known.length) return;
  [known[i], known[j]] = [known[j], known[i]];
  S.order = known;
  renderRouting();
};

window.saveSettings = async () => {
  const body = {
    strategy: ($('input[name="st"]:checked') || {}).value,
    timeouts: {
      connectMs: +$("#t-connectMs").value,
      firstByteMs: +$("#t-firstByteMs").value,
      totalMs: +$("#t-totalMs").value,
      streamIdleMs: +$("#t-streamIdleMs").value,
    },
    maxAttempts: +$("#s-maxAttempts").value,
    authRequired: $("#s-authRequired").checked,
    allowAnyFallback: $("#s-allowAnyFallback").checked,
    providerOrder: S.order || S.boot.settings.providerOrder,
  };
  try {
    await api("settings", { method: "PUT", body });
    toast("Pengaturan tersimpan ✓", "okk");
    await reload();
  } catch (e) { toast(e.message, "err"); }
};

window.rotateKey = async () => {
  if (!confirm("Rotate gateway key? Client lama akan ditolak.")) return;
  try { await api("gateway/rotate", { method: "POST" }); toast("Gateway key baru dibuat ✓", "okk"); await reload(); }
  catch (e) { toast(e.message, "err"); }
};

window.clearLogs = async () => {
  try { await api("logs/clear", { method: "POST" }); S.logs = []; renderLogs(); } catch (e) { toast(e.message, "err"); }
};

window.copy = copy;
window.refresh = refresh;

// ---------------- LOOP ----------------
async function refresh() {
  try {
    S.boot = await api("bootstrap");
    S.status = await api("status");
    render();
  } catch (e) {
    if (String(e.message).includes("ditolak")) location.reload();
  }
}

async function reload() {
  await refresh();
  if (S.tab === "playground") loadPlayModels();
}

async function loadStatus() {
  try {
    S.status = await api("status");
    const u = $("#uptime");
    if (u) u.textContent = "up " + fmtUptime(S.status.uptimeSec || 0);
    if (S.tab === "overview") renderOverview();
  } catch {}
}

async function loadLogs(force) {
  if (!S.logsOn && !force) return;
  try {
    const r = await api("logs?limit=120");
    S.logs = r.logs;
    if (S.tab === "logs") renderLogs();
  } catch {}
}

function render() {
  ({ overview: renderOverview, providers: renderProviders, routing: renderRouting, logs: renderLogs }[S.tab])();
}

$$("nav button").forEach((b) => b.addEventListener("click", () => {
  S.tab = b.dataset.tab;
  $$("nav button").forEach((x) => x.classList.toggle("active", x === b));
  render();
}));

refresh().then(() => { loadStatus(); loadLogs(true); });
setInterval(loadStatus, 8000);
setInterval(() => loadLogs(false), 4000);
</script>
</body>
</html>
